<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anubhab Sen</title>
<link rel="stylesheet" href="mobile.css">
<script src="theme-init.js"></script>
</head>
<body>

  <header class="topbar">
    <img id="topbarPhoto" class="topbar__photo" src="" alt="">
    <div class="topbar__id">
      <div id="topbarName" class="topbar__name">Loading…</div>
      <div id="topbarRole" class="topbar__role"></div>
    </div>
    <div class="topbar__spacer"></div>
    <div class="topbar__actions">
      <a id="downloadBtn" class="icon-btn icon-btn--wide" href="assets/Anubhab%20Sen%20-%20CV.pdf" download="Anubhab Sen - CV.pdf" title="Download Resume" aria-label="Download Resume">
        <span class="icon-download"></span><span class="btn-label">Resume</span>
      </a>
    </div>
  </header>

  <div id="app" class="layout">

    <section class="section section--panel">
      <h2 class="section__title">Contact</h2>
      <ul id="contactList" class="contact-list"></ul>
    </section>

    <section class="section section--content">
      <h2 class="section__title">Education</h2>
      <div id="educationList"></div>
    </section>

    <section class="section section--content">
      <h2 class="section__title">Experience</h2>
      <div id="experienceList"></div>
    </section>

    <section class="section section--content">
      <h2 class="section__title">Extracurricular Activities</h2>
      <div id="extracurricularList"></div>
    </section>

    <section class="section section--content">
      <h2 class="section__title">Independent Projects</h2>
      <div id="projectsGrid" class="project-grid"></div>
    </section>

    <section class="section section--content">
      <h2 class="section__title">Competitive Examinations Qualified</h2>
      <table class="exam-table">
        <thead>
          <tr><th>Date</th><th>Exam</th><th>Organizing Institute</th><th>Result</th></tr>
        </thead>
        <tbody id="examsBody"></tbody>
      </table>
    </section>

    <section class="section section--panel">
      <h2 class="section__title">Computer Skills</h2>
      <div id="skillsList"></div>
    </section>

    <section class="section section--panel">
      <h2 class="section__title">Languages</h2>
      <div id="languagesList"></div>
    </section>

    <section class="section section--panel">
      <h2 class="section__title">Hobbies</h2>
      <div id="hobbiesList"></div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
